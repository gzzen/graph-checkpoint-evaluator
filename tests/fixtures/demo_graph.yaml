# Synthetic two-task group used by the test suite.
# demo-q1: Welch t-test p-value after excluding two outlier samples (a hidden decision).
# demo-q2: mean of group A over all samples (a variant of the cohort node without exclusion).
schema: gce.checkpoint_graph.v1
group_id: demo/two-sample
title: Two-sample demo
tasks:
  - id: demo-q1
    answer_node: a_q1
    question: What is the Welch t-test p-value comparing groups A and B?
    ideal: {type: number, value: 0.013, decimals: 3}
    label_status: consistent
  - id: demo-q2
    answer_node: a_q2
    question: What is the mean of group A across all samples?
    ideal: {type: number, value: 5.21, decimals: 2}
    label_status: consistent
nodes:
  - id: n_load
    stage_type: inputs
    description: Load the measurement table.
    quantities:
      - {name: n_rows, expected: {type: integer, value: 100}, aliases: [rows, n_samples_raw], context: ["rows?", "samples?"]}
    provenance: {source: printed, ref: "cell 3"}
  - id: n_cohort
    stage_type: cohort
    description: Exclude the two outlier samples flagged in the metadata.
    depends_on: [n_load]
    hidden: true
    quantities:
      - {name: n_samples, expected: {type: integer, value: 98}, aliases: [n_kept, samples_after_exclusion], context: ["sample", "kept", "after"]}
    provenance: {source: printed, ref: "cell 5"}
  - id: n_cohort_all
    stage_type: cohort
    description: Keep all samples (no exclusion).
    depends_on: [n_load]
    variant_of: n_cohort
    gating: false
    quantities:
      - {name: n_samples, expected: {type: integer, value: 100}, aliases: [n_kept, samples_used], context: ["sample"]}
    provenance: {source: derived}
  - id: n_test
    stage_type: model
    description: Two-sample Welch t-test (unequal variances) of value between groups A and B.
    depends_on: [n_cohort]
    probe:
      patterns: ["ttest_ind\\([^)]*equal_var\\s*=\\s*False", "t\\.test\\(", "welch"]
    provenance: {source: printed, ref: "cell 7"}
  - id: n_stat
    stage_type: result_table
    description: Welch t statistic.
    depends_on: [n_test]
    quantities:
      - {name: t_statistic, expected: {type: number, value: 2.53, decimals: 2}, aliases: [t, t_stat, statistic], context: ["t[-_ ]?stat", "statistic", "\\bt\\s*="]}
    provenance: {source: printed, ref: "cell 7"}
  - id: a_q1
    stage_type: answer
    description: p-value of the Welch test.
    depends_on: [n_stat]
    quantities:
      - {name: p_value, expected: {type: number, value: 0.013, decimals: 3}, aliases: [p, pvalue], context: ["p[-_ ]?val", "\\bp\\s*="]}
    provenance: {source: printed, ref: "cell 7"}
  - id: a_q2
    stage_type: answer
    description: Mean of group A over all samples.
    depends_on: [n_cohort_all]
    quantities:
      - {name: mean_a, expected: {type: number, value: 5.21, decimals: 2}, aliases: [mean, mean_group_a], context: ["mean"]}
    provenance: {source: derived}
