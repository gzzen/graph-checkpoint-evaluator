[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "graph-checkpoint-evaluator"
version = "0.1.0"
description = "Score agent runs against task checkpoint graphs: how far an analysis got and where it first went wrong."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic", "openai"]
dev = ["pytest>=8"]

[project.scripts]
gce = "gce.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gce"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "gce/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
